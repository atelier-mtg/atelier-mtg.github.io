# L'appli du téléphone de l'Atelier MTG, https://atelier-mtg.github.io/ : fabriquée à partir du dépôt de l'Atelier
# (PierreRibeaucourt/atelier-mtg, outils/atelier/telephone_site.py) et publiée sur GitHub Pages.
# Réglage du dépôt : Settings › Pages › Source : GitHub Actions.
name: Appli du téléphone

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"          # toutes les trois heures : les nouveautés de l'Atelier arrivent seules
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  appli:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PierreRibeaucourt/atelier-mtg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow (icônes)
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Appli
        run: python outils/atelier/telephone_site.py site

      # La base de cartes de la recherche (outils/atelier/base_telephone.py) : celle de la fois d'avant, refaite à partir
      # des fichiers de Scryfall chaque semaine ou dès qu'une édition a de nouvelles cartes, puis publiée avec l'appli.
      - name: Base de cartes (celle de la fois d'avant)
        uses: actions/cache/restore@v4
        with:
          path: outils/atelier/base_cartes.json.gz
          key: base-cartes-${{ github.run_id }}
          restore-keys: base-cartes-

      - id: base
        name: Base de cartes
        run: python outils/atelier/base_telephone.py site/base

      - name: Base de cartes (gardée pour la fois suivante)
        if: steps.base.outputs.refaite == 'oui'
        uses: actions/cache/save@v4
        with:
          path: outils/atelier/base_cartes.json.gz
          key: base-cartes-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publication
        uses: actions/deploy-pages@v4
