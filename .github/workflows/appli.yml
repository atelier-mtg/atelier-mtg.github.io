# L'ancienne adresse de l'appli de l'Atelier MTG, https://atelier-mtg.github.io/ : une passerelle vers
# https://app.atelier-mtg.com/ (dépôt atelier-mtg/app), qui emporte les decks gardés par le navigateur ; fabriquée à partir
# du dépôt de l'Atelier (outils/atelier/telephone_site.py --passerelle) et publiée sur GitHub Pages.
# Réglage du dépôt : Settings › Pages › Source : GitHub Actions.
name: Passerelle

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"          # toutes les trois heures : les nouveautés de l'Atelier arrivent seules
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  appli:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PierreRibeaucourt/atelier-mtg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Passerelle vers app.atelier-mtg.com
        run: python outils/atelier/telephone_site.py --passerelle site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publication
        uses: actions/deploy-pages@v4
